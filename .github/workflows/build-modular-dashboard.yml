name: Build Modular Dashboard Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-modular-dashboard-preview
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mrmeee/beacon-modular-dashboard

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # The manifest lives on this branch; the app source lives on modular-dashboard.
      - name: Checkout add-on manifest
        uses: actions/checkout@v4
        with:
          sparse-checkout: beacon-modular-dashboard
          sparse-checkout-cone-mode: false

      - name: Read preview version
        id: preview
        run: |
          version=$(sed -n 's/^version: *"\(.*\)"/\1/p' beacon-modular-dashboard/config.yaml)
          if [ -z "$version" ]; then
            echo "No version found in beacon-modular-dashboard/config.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout modular dashboard source
        uses: actions/checkout@v4
        with:
          ref: modular-dashboard

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.preview.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:modular-dashboard
          cache-from: type=gha
          cache-to: type=gha,mode=max

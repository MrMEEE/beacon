name: Build Modular Dashboard Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-modular-dashboard-preview
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mrmeee/beacon-modular-dashboard
  IMAGE_TAG: "0.1.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout modular dashboard source
        uses: actions/checkout@v4
        with:
          ref: modular-dashboard

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:modular-dashboard
          cache-from: type=gha
          cache-to: type=gha,mode=max
